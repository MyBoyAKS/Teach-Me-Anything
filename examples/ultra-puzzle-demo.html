<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultra Puzzle Demo</title>
<style>
:root{--bg:#0e1118;--card:#181d2a;--scr:#131826;--fg:#e8ebf3;--muted:#a3abbd;--line:#2c3344;--ln:#6ea0ff;--tan:#ffa94d;--ok:#4ade80;--bad:#ff6b6b;--chip:#232a3d;--ui:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui)}
.screen{max-width:390px;margin:0 auto;background:var(--scr);padding:12px 14px 16px;position:relative}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--chip);border-radius:999px;padding:3px 10px}
.q{font-weight:700;font-size:1.02rem;margin:12px 0 6px;text-align:center}
.eq{font-family:"Times New Roman",serif;font-size:1.25rem;text-align:center;margin:6px 0 12px;line-height:1.6}
.eq i{font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-family:"Times New Roman",serif;font-size:1.15rem;background:var(--card);transition:none}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.msg{min-height:58px;margin-top:12px;border-radius:12px;padding:8px 10px;font-size:.88rem;display:grid;place-items:center;text-align:center}
.cursor{position:absolute;width:20px;height:20px;pointer-events:none}
.ripple{position:absolute;border:2px solid var(--tan);border-radius:50%;pointer-events:none}
</style>
</head>
<body>
<div class="screen" id="scr">
  <span class="chip">Puzzle · pick the next step</span>
  <div class="q">What do we put in place of b?</div>
  <div class="eq"><i>a</i> + <i>b</i> = 3 &nbsp;(1)<br><i>b</i> = −3<i>a</i> &nbsp;(2)</div>
  <div class="opts"><div class="opt" id="o0">3</div><div class="opt" id="o1">a − 3</div><div class="opt" id="o2">−3a</div><div class="opt" id="o3">0</div></div>
  <div class="msg" id="msg"></div>
  <div id="fx"></div>
</div>
<script>
const total=8;window.TOTAL=total;
const clamp=v=>Math.max(0,Math.min(1,v)),ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,lerp=(a,b,p)=>a+(b-a)*p,seg=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const CUR='<svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';
function center(id){const e=document.getElementById(id),s=document.getElementById('scr').getBoundingClientRect(),r=e.getBoundingClientRect();return [r.left-s.left+r.width/2,r.top-s.top+r.height/2]}
window.render=function(T){
  const o=[0,1,2,3].map(i=>document.getElementById('o'+i));o.forEach(e=>e.className='opt');
  const msg=document.getElementById('msg');msg.innerHTML='';msg.style.background='transparent';
  let [x1,y1]=center("o1"),[x2,y2]=center("o2");x1+=22;y1+=8;x2+=24;y2+=8;let cx,cy;
  if(T<2){const p=seg(T,.3,1.6);cx=lerp(330,x1,p);cy=lerp(30,y1,p)}else if(T<4.6){cx=x1;cy=y1}else{const p=seg(T,4.6,5.6);cx=lerp(x1,x2,p);cy=lerp(y1,y2,p)}
  if(T>=2.1&&T<4.9){o[1].className='opt bad';msg.style.background='color-mix(in srgb,#ff6b6b 14%,transparent)';msg.innerHTML='<span>Not quite. <b>Hint:</b> look at equation (2). What is b equal to?</span>'}
  if(T>=5.9){o[2].className='opt good';msg.style.background='color-mix(in srgb,#4ade80 16%,transparent)';msg.innerHTML='<span><b>Correct!</b> b = −3a, so (1) becomes a + (−3a) = 3. Next chapter ▶</span>'}
  let fx=`<div class="cursor" style="left:${cx-3}px;top:${cy-3}px">${CUR}</div>`;
  const rip=(t0,x,y)=>{const u=(T-t0)/.5;if(u>0&&u<1){const r=8+u*24;fx+=`<div class="ripple" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;opacity:${1-u}"></div>`}};
  rip(1.7,x1,y1);rip(5.6,x2,y2);document.getElementById('fx').innerHTML=fx;
};
render(0);
</script>
</body>
</html>
